<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:oklch(97% 0.012 75);
  --surface:oklch(99% 0.005 75);
  --surface-2:oklch(95% 0.015 75);
  --text:oklch(23% 0.02 55);
  --text-muted:oklch(53% 0.02 55);
  --border:oklch(90% 0.013 75);
  --coral:oklch(64% 0.15 35);
  --coral-soft:oklch(93% 0.035 35);
  --teal:oklch(58% 0.10 196);
  --teal-soft:oklch(93% 0.028 196);
  --success:oklch(60% 0.12 150);
  --success-soft:oklch(93% 0.035 150);
  --amber:oklch(72% 0.13 70);
  --amber-soft:oklch(93% 0.04 70);
  --gold:oklch(70% 0.11 85);
  --gold-soft:oklch(93% 0.03 85);
  --indigo:oklch(56% 0.12 265);
  --indigo-soft:oklch(93% 0.025 265);
  --berry:oklch(56% 0.14 340);
  --berry-soft:oklch(93% 0.035 340);
  --violet:oklch(58% 0.13 300);
  --violet-soft:oklch(93% 0.03 300);
}
*{box-sizing:border-box;}
body{margin:0;}
.h{font-family:'Lora',Georgia,'Times New Roman',serif;}
.b{font-family:'Manrope',system-ui,-apple-system,sans-serif;}
.row{display:flex;align-items:center;}
</style>
</helmet>

<div class="b" style="width:390px;height:844px;background:var(--bg);color:var(--text);overflow:hidden;position:relative;">
  <div style="position:absolute;inset:0;overflow-y:auto;padding:24px 20px 40px;">

    <div class="row" style="justify-content:space-between;margin-bottom:18px;">
      <div class="row" style="gap:10px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="2"><path d="M15 6l-6 6 6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div class="h" style="font-size:22px;font-weight:600;">Categorías</div>
      </div>
      <div style="width:36px;height:36px;border-radius:10px;background:var(--coral);display:flex;align-items:center;justify-content:center;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--surface)" stroke-width="2.2"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>
      </div>
    </div>

    <!-- Existing categories list -->
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:16px;margin-bottom:22px;overflow:hidden;">
      <div class="row" style="padding:13px 14px;gap:12px;border-bottom:1px solid var(--border);">
        <div style="width:32px;height:32px;border-radius:9px;background:var(--coral-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--coral)" stroke-width="1.8"><path d="M6 3v7a2 2 0 0 0 4 0V3M8 10v11" stroke-linecap="round" stroke-linejoin="round"/><path d="M17 3c-1.4 0-2.5 1.6-2.5 4.5S15.6 12 17 12v9" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <span style="flex:1;font-size:14px;font-weight:600;">Comida</span>
        <span style="font-size:11.5px;color:var(--text-muted);">Gasto</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="1.8"><path d="M4 20h4L18.5 9.5a2.1 2.1 0 0 0-3-3L5 17v3z" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="row" style="padding:13px 14px;gap:12px;border-bottom:1px solid var(--border);">
        <div style="width:32px;height:32px;border-radius:9px;background:var(--indigo-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--indigo)" stroke-width="1.8"><rect x="6" y="3.5" width="12" height="17" rx="1"/><path d="M9.2 7.5h1.4M13.4 7.5h1.4M9.2 11.5h1.4M13.4 11.5h1.4M9.2 15.5h1.4M13.4 15.5h1.4" stroke-linecap="round"/></svg>
        </div>
        <span style="flex:1;font-size:14px;font-weight:600;">Arriendo y hogar</span>
        <span style="font-size:11.5px;color:var(--text-muted);">Gasto</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="1.8"><path d="M4 20h4L18.5 9.5a2.1 2.1 0 0 0-3-3L5 17v3z" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="row" style="padding:13px 14px;gap:12px;border-bottom:1px solid var(--border);">
        <div style="width:32px;height:32px;border-radius:9px;background:var(--teal-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--teal)" stroke-width="1.8"><path d="M4.5 16 6 11.3A2 2 0 0 1 7.9 10h8.2a2 2 0 0 1 1.9 1.3L19.5 16" stroke-linecap="round" stroke-linejoin="round"/><path d="M3.5 16h17v2.5a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1V18H6.5v.5a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1z" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <span style="flex:1;font-size:14px;font-weight:600;">Transporte</span>
        <span style="font-size:11.5px;color:var(--text-muted);">Gasto</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="1.8"><path d="M4 20h4L18.5 9.5a2.1 2.1 0 0 0-3-3L5 17v3z" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="row" style="padding:13px 14px;gap:12px;">
        <div style="width:32px;height:32px;border-radius:9px;background:var(--success-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--success)" stroke-width="1.8"><rect x="3.5" y="7" width="17" height="12" rx="2"/><path d="M3.5 10.5h17" stroke-linecap="round"/><circle cx="16.5" cy="14" r="1.2" fill="var(--success)" stroke="none"/></svg>
        </div>
        <span style="flex:1;font-size:14px;font-weight:600;">Sueldo</span>
        <span style="font-size:11.5px;color:var(--text-muted);">Ingreso</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="1.8"><path d="M4 20h4L18.5 9.5a2.1 2.1 0 0 0-3-3L5 17v3z" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </div>
  </div>

  <!-- Scrim -->
  <div style="position:absolute;inset:0;background:oklch(20% 0.02 55 / 0.42);"></div>

  <!-- New category sheet -->
  <div style="position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:24px 24px 0 0;padding:14px 20px 26px;max-height:88%;overflow-y:auto;box-shadow:0 -8px 24px oklch(20% 0.02 55 / 0.15);">
    <div style="width:36px;height:4px;background:var(--border);border-radius:999px;margin:0 auto 16px;"></div>
    <div class="row" style="justify-content:space-between;margin-bottom:18px;">
      <div class="h" style="font-size:18px;font-weight:600;">Nueva categoría</div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2"><path d="M6 6l12 12M18 6 6 18" stroke-linecap="round"/></svg>
    </div>

    <label style="font-size:12px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.04em;">Nombre</label>
    <div style="margin-top:6px;margin-bottom:16px;border:1px solid var(--border);border-radius:12px;padding:12px 14px;font-size:14.5px;color:var(--text);background:var(--bg);">Mascotas</div>

    <div class="row" style="background:var(--surface-2);border-radius:12px;padding:4px;margin-bottom:18px;">
      <div style="flex:1;text-align:center;background:var(--coral);color:var(--surface);font-weight:700;font-size:13.5px;padding:9px;border-radius:9px;">Gasto</div>
      <div style="flex:1;text-align:center;color:var(--text-muted);font-weight:700;font-size:13.5px;padding:9px;">Ingreso</div>
    </div>

    <label style="font-size:12px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.04em;">Color</label>
    <div class="row" style="gap:10px;margin:8px 0 18px;">
      <div style="width:30px;height:30px;border-radius:50%;background:var(--coral-soft);border:2.5px solid var(--coral);"></div>
      <div style="width:30px;height:30px;border-radius:50%;background:var(--gold-soft);"></div>
      <div style="width:30px;height:30px;border-radius:50%;background:var(--success-soft);"></div>
      <div style="width:30px;height:30px;border-radius:50%;background:var(--teal-soft);"></div>
      <div style="width:30px;height:30px;border-radius:50%;background:var(--indigo-soft);"></div>
      <div style="width:30px;height:30px;border-radius:50%;background:var(--violet-soft);"></div>
      <div style="width:30px;height:30px;border-radius:50%;background:var(--berry-soft);"></div>
      <div style="width:30px;height:30px;border-radius:50%;background:var(--amber-soft);"></div>
    </div>

    <label style="font-size:12px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.04em;">Ícono</label>
    <div style="display:grid;grid-template-columns:repeat(6, minmax(0, 1fr));gap:10px;margin-top:8px;">
      <div style="aspect-ratio:1;border-radius:12px;background:var(--coral-soft);border:2px solid var(--coral);display:flex;align-items:center;justify-content:center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--coral)" stroke-width="1.8"><circle cx="7" cy="9" r="1.6"/><circle cx="11" cy="6.5" r="1.6"/><circle cx="15" cy="6.5" r="1.6"/><circle cx="18" cy="9.5" r="1.6"/><path d="M12.5 12c3 0 5 2 5 4.3 0 2-1.6 3.2-3.6 2.7-.9-.2-1.9-.2-2.8 0-2 .5-3.6-.7-3.6-2.7 0-2.3 2-4.3 5-4.3z"/></svg>
      </div>
      <div style="aspect-ratio:1;border-radius:12px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="1.8"><path d="M6 3v7a2 2 0 0 0 4 0V3M8 10v11" stroke-linecap="round" stroke-linejoin="round"/><path d="M17 3c-1.4 0-2.5 1.6-2.5 4.5S15.6 12 17 12v9" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div style="aspect-ratio:1;border-radius:12px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="1.8"><rect x="6" y="3.5" width="12" height="17" rx="1"/><path d="M9.2 7.5h1.4M13.4 7.5h1.4M9.2 11.5h1.4M13.4 11.5h1.4M9.2 15.5h1.4M13.4 15.5h1.4" stroke-linecap="round"/></svg>
      </div>
      <div style="aspect-ratio:1;border-radius:12px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="1.8"><path d="M4.5 16 6 11.3A2 2 0 0 1 7.9 10h8.2a2 2 0 0 1 1.9 1.3L19.5 16" stroke-linecap="round" stroke-linejoin="round"/><path d="M3.5 16h17v2.5a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1V18H6.5v.5a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1z" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div style="aspect-ratio:1;border-radius:12px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="1.8"><path d="M6.5 8h11l-1 11.5a2 2 0 0 1-2 1.8h-5a2 2 0 0 1-2-1.8z" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 8V6a3 3 0 0 1 6 0v2" stroke-linecap="round"/></svg>
      </div>
      <div style="aspect-ratio:1;border-radius:12px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="1.8"><rect x="3.5" y="5.5" width="17" height="13" rx="2"/><path d="M3.5 9.5h3M3.5 14.5h3M17.5 9.5h3M17.5 14.5h3" stroke-linecap="round"/></svg>
      </div>
      <div style="aspect-ratio:1;border-radius:12px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="1.8"><path d="M12 19.5s-6.8-4.1-8.6-8.2A4.6 4.6 0 0 1 12 8a4.6 4.6 0 0 1 8.6 3.3c-1.8 4.1-8.6 8.2-8.6 8.2z" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div style="aspect-ratio:1;border-radius:12px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="1.8"><rect x="4" y="9" width="16" height="11" rx="1"/><path d="M4 9V6.5a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1V9" stroke-linecap="round"/><path d="M12 5.5v14.5"/><path d="M12 5.5c-1.2-2.3-5-2.6-5 0s3.8 2.3 5 0zM12 5.5c1.2-2.3 5-2.6 5 0s-3.8 2.3-5 0z" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div style="aspect-ratio:1;border-radius:12px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="1.8"><path d="M5 9h11a3 3 0 0 1 0 6h-1" stroke-linecap="round"/><path d="M5 9v6a4 4 0 0 0 4 4h2a4 4 0 0 0 4-4v-1" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 4c-.7.8-.7 1.5 0 2.3M11 4c-.7.8-.7 1.5 0 2.3" stroke-linecap="round"/></svg>
      </div>
      <div style="aspect-ratio:1;border-radius:12px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="1.8"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H12v17H6.5A2.5 2.5 0 0 0 4 22.5v-17z" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 5.5A2.5 2.5 0 0 0 17.5 3H12v17h5.5a2.5 2.5 0 0 1 2.5 2.5v-17z" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div style="aspect-ratio:1;border-radius:12px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="1.8"><path d="M21 3 3 10.5l7 2.5 2 7L21 3z" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div style="aspect-ratio:1;border-radius:12px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="1.8"><path d="M3 17l6-6 4 4 8-8" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 7h6v6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </div>

    <div style="width:100%;background:var(--coral);color:var(--surface);text-align:center;font-weight:700;font-size:15px;border-radius:12px;padding:14px;margin-top:22px;">Guardar categoría</div>
  </div>
</div>
</x-dc>
</body>
</html>
