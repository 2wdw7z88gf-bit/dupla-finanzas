<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:oklch(97% 0.012 75);
  --surface:oklch(99% 0.005 75);
  --surface-2:oklch(95% 0.015 75);
  --text:oklch(23% 0.02 55);
  --text-muted:oklch(53% 0.02 55);
  --border:oklch(90% 0.013 75);
  --coral:oklch(64% 0.15 35);
  --coral-dark:oklch(54% 0.16 32);
  --coral-soft:oklch(93% 0.035 35);
  --teal:oklch(58% 0.10 196);
  --teal-soft:oklch(93% 0.028 196);
}
*{box-sizing:border-box;}
body{margin:0;}
a{color:var(--coral);text-decoration:none;}
a:hover{color:var(--coral-dark);}
.h{font-family:'Lora',Georgia,'Times New Roman',serif;}
.b{font-family:'Manrope',system-ui,-apple-system,sans-serif;}
</style>
</helmet>

<div class="b" style="width:390px;height:844px;background:var(--bg);color:var(--text);overflow:hidden;position:relative;">
  <div style="position:absolute;inset:0;overflow-y:auto;padding:56px 28px 40px;display:flex;flex-direction:column;align-items:center;">

    <!-- Logo mark -->
    <div style="position:relative;width:64px;height:44px;margin-bottom:18px;">
      <div style="position:absolute;left:0;top:0;width:44px;height:44px;border-radius:50%;background:var(--coral-soft);"></div>
      <div style="position:absolute;left:20px;top:0;width:44px;height:44px;border-radius:50%;background:var(--teal-soft);"></div>
      <div style="position:absolute;left:22px;top:14px;width:20px;height:16px;display:flex;align-items:center;justify-content:center;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--surface)" stroke-width="2.2"><path d="M12 19.5s-6.8-4.1-8.6-8.2A4.6 4.6 0 0 1 12 8a4.6 4.6 0 0 1 8.6 3.3c-1.8 4.1-8.6 8.2-8.6 8.2z" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </div>

    <div class="h" style="font-size:30px;font-weight:600;letter-spacing:-0.02em;">Dupla</div>
    <div style="font-size:14px;color:var(--text-muted);margin-top:4px;margin-bottom:36px;text-align:center;">Sus finanzas, juntos.</div>

    <!-- Form card -->
    <div style="width:100%;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:24px;box-shadow:0 1px 2px oklch(0% 0 0 / 0.04);">
      <label style="font-size:12px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.04em;">Correo</label>
      <div style="margin-top:6px;margin-bottom:16px;border:1px solid var(--border);border-radius:12px;padding:13px 14px;font-size:15px;color:var(--text-muted);background:var(--bg);">luciana@correo.com</div>

      <label style="font-size:12px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.04em;">Contraseña</label>
      <div style="margin-top:6px;margin-bottom:22px;border:1px solid var(--border);border-radius:12px;padding:13px 14px;font-size:15px;color:var(--text-muted);background:var(--bg);letter-spacing:3px;">••••••••</div>

      <div style="width:100%;background:var(--coral);color:var(--surface);text-align:center;font-weight:700;font-size:15px;border-radius:12px;padding:14px;">Iniciar sesión</div>

      <div style="display:flex;align-items:center;gap:10px;margin:20px 0;">
        <div style="flex:1;height:1px;background:var(--border);"></div>
        <div style="font-size:12px;color:var(--text-muted);">o</div>
        <div style="flex:1;height:1px;background:var(--border);"></div>
      </div>

      <div style="width:100%;border:1.5px solid var(--coral);color:var(--coral);text-align:center;font-weight:700;font-size:14px;border-radius:12px;padding:13px;">Crear cuenta e invitar a mi pareja</div>
    </div>

    <div style="flex:1;"></div>

    <div style="display:flex;align-items:center;gap:8px;color:var(--text-muted);font-size:12.5px;margin-top:28px;text-align:center;line-height:1.5;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="flex-shrink:0;"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3" stroke-linecap="round"/></svg>
      <span>Tus datos son privados: solo Gonzalo y Luciana pueden verlos.</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
